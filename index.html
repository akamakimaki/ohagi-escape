<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おはぎから逃げろ！</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f3efe7;
            font-family: sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        #game {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background:
                linear-gradient(#ffffff80, #ffffff80),
                repeating-linear-gradient(0deg,
                    #ddd 0px,
                    #ddd 1px,
                    transparent 1px,
                    transparent 50px),
                repeating-linear-gradient(90deg,
                    #ddd 0px,
                    #ddd 1px,
                    transparent 1px,
                    transparent 50px);
        }

        #score {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 10;
            font-size: 20px;
            font-weight: bold;
        }

        #player {
            position: absolute;
            width: 72px;
            height: 72px;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
        }

        #player img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .ohagi {
            position: absolute;
            width: 32px;
            height: 32px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 28px;

            transform: translate(-50%, -50%);
            z-index: 5;
        }

        .ohagi.fast {
            font-size: 24px;
        }

        .ohagi.giant {
            width: 76px;
            height: 76px;
            font-size: 68px;
        }

        #gameOver {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 50;
            background: rgba(0, 0, 0, .58);
            color: white;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
        }

        #gameOver h1 {
            margin: 0 0 8px;
            font-size: 36px;
        }

        #gameOver p {
            font-size: 20px;
        }

        button {
            margin-top: 10px;
            padding: 12px 22px;
            border: 0;
            border-radius: 999px;
            font-size: 18px;
            cursor: pointer;
        }

        .giyu-warning {
            position: absolute;
            z-index: 30;

            display: flex;
            flex-direction: column;
            align-items: center;

            transform: translate(-50%, -50%);

            pointer-events: none;
        }

        .giyu-face {
            width: 140px;
            height: 140px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .giyu-face img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .giyu-word {
            margin-top: 4px;
            padding: 5px 12px;

            background: white;
            border-radius: 20px;

            font-size: 20px;
            font-weight: bold;
            white-space: nowrap;
        }

        .warning {
            position: absolute;
            z-index: 25;

            width: 40px;
            height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 3px solid #d33;
            border-radius: 50%;

            color: #d33;
            background: rgba(255, 255, 255, 0.9);

            font-size: 28px;
            font-weight: bold;

            transform: translate(-50%, -50%);

            animation: warningBlink 0.2s infinite alternate;

            pointer-events: none;
        }

        @keyframes warningBlink {
            from {
                opacity: 0.35;
                transform: translate(-50%, -50%) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.1);
            }
        }

        .warning.fast {
            width: 46px;
            height: 46px;

            border-color: #e59600;
            color: #e59600;

            font-size: 22px;
        }

        .warning.giant {
            width: 54px;
            height: 54px;

            border-color: #8b1e1e;
            color: #8b1e1e;

            font-size: 30px;

            animation-duration: 0.12s;
        }

        .giyu-danger {
            position: absolute;
            z-index: 20;

            background: rgba(220, 40, 40, 0.35);

            pointer-events: none;

            animation: dangerBlink 0.15s infinite alternate;
        }

        .giyu-danger.top {
            top: 0;
            left: 0;
            width: 100%;
            height: 26px;
        }

        .giyu-danger.right {
            top: 0;
            right: 0;
            width: 26px;
            height: 100%;
        }

        .giyu-danger.bottom {
            bottom: 0;
            left: 0;
            width: 100%;
            height: 26px;
        }

        .giyu-danger.left {
            top: 0;
            left: 0;
            width: 26px;
            height: 100%;
        }

        @keyframes dangerBlink {
            from {
                opacity: 0.25;
            }

            to {
                opacity: 1;
            }
        }

        #player.hit {
            animation: sanemiShake 0.28s ease-in-out;
        }

        @keyframes sanemiShake {
            0% {
                transform: translate(-50%, -50%) translate(0, 0) rotate(0deg);
            }

            20% {
                transform: translate(-50%, -50%) translate(-8px, 2px) rotate(-5deg);
            }

            40% {
                transform: translate(-50%, -50%) translate(8px, -2px) rotate(5deg);
            }

            60% {
                transform: translate(-50%, -50%) translate(-6px, 2px) rotate(-4deg);
            }

            80% {
                transform: translate(-50%, -50%) translate(6px, -1px) rotate(4deg);
            }

            100% {
                transform: translate(-50%, -50%) translate(0, 0) rotate(0deg);
            }
        }

        #player.dodge {
            animation: sanemiDodge 0.16s ease-out;
        }

        @keyframes sanemiDodge {
            0% {
                transform: translate(-50%, -50%) translateX(0);
            }

            50% {
                transform: translate(-50%, -50%) translateX(5px);
            }

            100% {
                transform: translate(-50%, -50%) translateX(0);
            }
        }
    </style>

    <meta property="og:title" content="おはぎから逃げろ！">
    <meta property="og:description" content="🌊の🟤攻撃をかわし続けろ！">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://akamakimaki.github.io/ohagi-escape/">
    <meta property="og:image" content="https://akamakimaki.github.io/ohagi-escape/images/title.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <meta name="twitter:card" content="summary_large_image">
</head>

<body>

    <div id="game">

        <div id="score">
            かわしたおはぎ：0
        </div>

        <div id="player">
            <img src="images/sanemi.png" alt="実弥">
        </div>

        <div id="gameOver">
            <h1>食わされたァ</h1>
            <p id="result"></p>

            <button id="shareButton">
                Blueskyで結果をシェア
            </button>

            <button onclick="location.reload()">
                もう一回
            </button>
        </div>

    </div>

    <script>
        const game = document.getElementById("game");
        const player = document.getElementById("player");
        const scoreText = document.getElementById("score");
        const gameOverScreen = document.getElementById("gameOver");
        const result = document.getElementById("result");
        const shareButton =
            document.getElementById("shareButton");

        let playerX = window.innerWidth / 2;
        let playerY = window.innerHeight / 2;

        let ohagis = [];
        let score = 0;
        let playing = true;

        const startTime = performance.now();

        function movePlayer(x, y) {
            const margin = 28;

            playerX = Math.max(
                margin,
                Math.min(window.innerWidth - margin, x)
            );

            playerY = Math.max(
                margin,
                Math.min(window.innerHeight - margin, y)
            );

            player.style.left = playerX + "px";
            player.style.top = playerY + "px";
        }

        movePlayer(playerX, playerY);

        game.addEventListener("pointermove", event => {
            if (!playing) return;

            if (event.buttons || event.pointerType === "touch") {
                movePlayer(event.clientX, event.clientY);
            }
        });

        game.addEventListener("pointerdown", event => {
            if (!playing) return;

            movePlayer(event.clientX, event.clientY);
        });

        function elapsed() {
            return (performance.now() - startTime) / 1000;
        }

        /* =========================
           おはぎ作成
        ========================= */

        function createOhagi(options = {}) {
            if (!playing) return;

            const el = document.createElement("div");
            el.className = "ohagi";
            el.textContent = "🟤";

            if (options.fast) {
                el.classList.add("fast");
            }

            if (options.giant) {
                el.classList.add("giant");
            }

            game.appendChild(el);

            const side =
                options.side ??
                Math.floor(Math.random() * 4);

            let x = options.x;
            let y = options.y;

            if (x === undefined || y === undefined) {
                const spawn = getSpawnPosition(side);

                x = spawn.x;
                y = spawn.y;
            }
            let targetX =
                options.targetX ??
                (
                    window.innerWidth * 0.1 +
                    Math.random() * window.innerWidth * 0.8
                );

            let targetY =
                options.targetY ??
                (
                    window.innerHeight * 0.1 +
                    Math.random() * window.innerHeight * 0.8
                );

            const dx = targetX - x;
            const dy = targetY - y;

            const length = Math.sqrt(dx * dx + dy * dy);

            let speed = 2.2 + Math.random() * 1.3;
            let radius = 14;

            if (options.fast) {
                speed = 5.5 + Math.random() * 1.5;
                radius = 11;
            }

            if (options.giant) {
                speed = 1.7 + Math.random() * 0.8;
                radius = 34;
            }

            if (options.speed) {
                speed = options.speed;
            }

            const vx = dx / length * speed;
            const vy = dy / length * speed;

            ohagis.push({
                el,
                x,
                y,
                vx,
                vy,
                radius
            });
        }

        /* =========================
           通常攻撃
        ========================= */

        function getSpawnPosition(side) {
            const margin = 50;

            if (side === 0) {
                return {
                    x: Math.random() * window.innerWidth,
                    y: -margin
                };
            }

            if (side === 1) {
                return {
                    x: window.innerWidth + margin,
                    y: Math.random() * window.innerHeight
                };
            }

            if (side === 2) {
                return {
                    x: Math.random() * window.innerWidth,
                    y: window.innerHeight + margin
                };
            }

            return {
                x: -margin,
                y: Math.random() * window.innerHeight
            };
        }

        function showWarning(x, y, delay, type = "normal") {
            const warning = document.createElement("div");

            warning.className = `warning ${type}`;

            if (type === "fast") {
                warning.textContent = "!!";
            } else if (type === "giant") {
                warning.textContent = "⚠";
            } else {
                warning.textContent = "!";
            }

            const inset = 24;

            let warningX = x;
            let warningY = y;

            if (x < 0) {
                warningX = inset;
            }

            if (x > window.innerWidth) {
                warningX = window.innerWidth - inset;
            }

            if (y < 0) {
                warningY = inset;
            }

            if (y > window.innerHeight) {
                warningY = window.innerHeight - inset;
            }

            warning.style.left = warningX + "px";
            warning.style.top = warningY + "px";

            game.appendChild(warning);

            setTimeout(() => {
                warning.remove();
            }, delay);
        }

        function normalAttack() {
            if (!playing) return;

            const roll = Math.random();
            const side = Math.floor(Math.random() * 4);

            const spawn = getSpawnPosition(side);

            const options = {
                side,
                x: spawn.x,
                y: spawn.y
            };

            let warningDelay = 450;
            let warningType = "normal";

            const seconds = elapsed();

            if (seconds >= 8 && roll < 0.20) {
                options.giant = true;
                warningDelay = 700;
                warningType = "giant";

            } else if (
                (seconds >= 8 && roll < 0.40) ||
                (seconds < 8 && roll < 0.20)
            ) {
                options.fast = true;
                warningDelay = 250;
                warningType = "fast";
            }


            showWarning(
                spawn.x,
                spawn.y,
                warningDelay,
                warningType
            );

            setTimeout(() => {
                if (!playing) return;

                createOhagi(options);

            }, warningDelay);
        }


        /* =========================
           時間経過で増える
        ========================= */

        function spawnLoop() {
            if (!playing) return;

            const seconds = elapsed();

            let count = 1;

            if (seconds > 10) {
                count = 2;
            }

            if (seconds > 25) {
                count = 3;
            }

            if (seconds > 45) {
                count = 4;
            }

            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    normalAttack();
                }, i * 110);
            }

            const delay =
                Math.max(
                    260,
                    700 - seconds * 8
                );

            setTimeout(spawnLoop, delay);
        }

        /* =========================
           義勇イベント
        ========================= */

        function showGiyu(side) {
            const box = document.createElement("div");

            box.className = "giyu-warning";

            const giyuWords = [
                "不死川",
                "食え",
                "おはぎだ",
                "遠慮するな",
                "まだある",
                "不死川、こっちだ"
            ];

            const word =
                giyuWords[Math.floor(Math.random() * giyuWords.length)];

            box.innerHTML = `
        <div class="giyu-face">
            <img src="images/giyu.png" alt="義勇">
        </div>
        <div class="giyu-word">${word}</div>
    `;

            if (side === 0) {
                box.style.top = "10px";
                box.style.left = "50%";
            }

            if (side === 1) {
                box.style.right = "10px";
                box.style.top = "50%";
            }

            if (side === 2) {
                box.style.bottom = "10px";
                box.style.left = "50%";
            }

            if (side === 3) {
                box.style.left = "10px";
                box.style.top = "50%";
            }

            game.appendChild(box);

            return box;
        }
        function showGiyuDanger(side) {
            const danger = document.createElement("div");

            danger.className = "giyu-danger";

            if (side === 0) {
                danger.classList.add("top");
            }

            if (side === 1) {
                danger.classList.add("right");
            }

            if (side === 2) {
                danger.classList.add("bottom");
            }

            if (side === 3) {
                danger.classList.add("left");
            }

            game.appendChild(danger);

            return danger;
        }
        function giyuAttack() {
            if (!playing) return;

            const side =
                Math.floor(Math.random() * 4);

            const giyu =
                showGiyu(side);

            const danger =
                showGiyuDanger(side);

            const pattern =
                Math.floor(Math.random() * 3);

            // 0: 連射
            // 1: 扇状
            // 2: 巨大おはぎ

            const delay =
                pattern === 2 ? 850 : 500;

            setTimeout(() => {
                giyu.remove();
                danger.remove();

                if (!playing) return;

                if (pattern === 0) {
                    giyuRapidFire(side);
                }

                if (pattern === 1) {
                    giyuSpreadShot(side);
                }

                if (pattern === 2) {
                    giyuGiantShot(side);
                }

            }, delay);
        }

        function giyuRapidFire(side) {
            for (let i = 0; i < 12; i++) {

                setTimeout(() => {
                    if (!playing) return;

                    createOhagi({
                        side,

                        targetX:
                            playerX +
                            (Math.random() - 0.5) * 250,

                        targetY:
                            playerY +
                            (Math.random() - 0.5) * 250,

                        speed:
                            3.5 + Math.random() * 1.2
                    });

                }, i * 60);
            }
        }

        function giyuSpreadShot(side) {
            const baseX = playerX;
            const baseY = playerY;

            for (let i = -3; i <= 3; i++) {

                let targetX = baseX;
                let targetY = baseY;

                if (side === 0 || side === 2) {
                    targetX += i * 85;
                }

                if (side === 1 || side === 3) {
                    targetY += i * 85;
                }

                createOhagi({
                    side,
                    targetX,
                    targetY,
                    speed: 3
                });
            }
        }

        function giyuGiantShot(side) {
            createOhagi({
                side,
                giant: true,
                targetX: playerX,
                targetY: playerY,
                speed: 2.1
            });
        }

        function giyuLoop() {
            if (!playing) return;

            const next =
                3000 +
                Math.random() * 2000;

            setTimeout(() => {
                if (!playing) return;

                giyuAttack();
                giyuLoop();

            }, next);
        }

        /* =========================
           当たり判定
        ========================= */

        function collision(o) {
            const dx =
                playerX - o.x;

            const dy =
                playerY - o.y;

            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );

            return distance <
                20 + o.radius;
        }

        shareButton.addEventListener("click", () => {
            const gameUrl =
                "https://akamakimaki.github.io/ohagi-escape/";

            const text =
                `🌊の🟤攻撃から${score}個かわした！\n` +
                `でも最後は食わされたァ！！\n\n` +
                `${gameUrl}\n\n` +
                `#おはぎから逃げろ`;

            const url =
                "https://bsky.app/intent/compose?text=" +
                encodeURIComponent(text);

            window.open(url, "_blank");
        });

        function endGame() {
            playing = false;

            // 回避アニメーションを解除してから命中アニメーション
            player.classList.remove("dodge");
            player.classList.remove("hit");
            void player.offsetWidth;
            player.classList.add("hit");

            setTimeout(() => {
                gameOverScreen.style.display = "flex";

                result.textContent =
                    score +
                    "個のおはぎをかわした";
            }, 280);
        }

        /* =========================
           描画
        ========================= */

        function update() {
            if (!playing) return;

            for (
                let i = ohagis.length - 1;
                i >= 0;
                i--
            ) {
                const o = ohagis[i];

                o.x += o.vx;
                o.y += o.vy;

                o.el.style.left =
                    o.x + "px";

                o.el.style.top =
                    o.y + "px";

                if (collision(o)) {
                    endGame();
                    return;
                }

                const outside =
                    o.x < -150 ||
                    o.x >
                    window.innerWidth + 150 ||
                    o.y < -150 ||
                    o.y >
                    window.innerHeight + 150;

                if (outside) {
                    o.el.remove();

                    ohagis.splice(
                        i,
                        1
                    );

                    score++;

                    scoreText.textContent =
                        "かわしたおはぎ：" +
                        score;
                    player.classList.remove("dodge");
                    void player.offsetWidth;
                    player.classList.add("dodge");

                    setTimeout(() => {
                        player.classList.remove("dodge");
                    }, 160);
                }
            }

            requestAnimationFrame(update);
        }

        /* 開始 */

        spawnLoop();

        /* まず4秒後に義勇を必ず出す */
        setTimeout(() => {
            if (!playing) return;

            giyuAttack();
            giyuLoop();

        }, 4000);

        update();

    </script>

</body>

</html>
